<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AR probe</title>
<style>
  html,body{margin:0;background:linear-gradient(#C9D4EA,#F7F3E6);height:100%}
  #gl{display:block;width:100vw;height:100vh}
  #err{position:fixed;inset:16px;font:13px/1.5 ui-monospace,Consolas,monospace;
       color:#fff;background:#B0223F;padding:16px;border-radius:12px;white-space:pre-wrap;
       display:none;z-index:9;overflow:auto}
  #ok{position:fixed;left:12px;top:12px;font:12px ui-monospace,Consolas,monospace;
      background:#141414;color:#8BE04F;padding:8px 12px;border-radius:8px;z-index:8}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="err"></div>
<div id="ok">booting…</div>
<script type="module">
/* Dev harness. Builds a real scene, fast-forwards it to ?t seconds and renders
   one frame from either the judge's eye or an outside overview, so both scenes
   can be checked headlessly without a phone. Not linked from anywhere. */
const err = m => { const e = document.getElementById('err');
                   e.style.display = 'block'; e.textContent += m + '\n'; };
addEventListener('error', e => err('ERROR ' + e.message));
addEventListener('unhandledrejection', e => err('REJECT ' + (e.reason?.stack || e.reason)));

const Q = new URLSearchParams(location.search);
const which = Q.get('s') === 'hit' ? 'hit' : 'miss';
const at = parseFloat(Q.get('t') ?? '6');
const viewName = Q.get('view') || 'judge';

try {
  const THREE = await import('./vendor/three.module.min.js');
  const { buildScene } = await import('./scene.js?v=2');

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'),
                                             antialias: true, alpha: true });
  renderer.setPixelRatio(2);
  renderer.setSize(innerWidth, innerHeight, false);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.3));
  const sun = new THREE.DirectionalLight(0xffffff, 1.45);
  sun.position.set(2, 6, 3); scene.add(sun);

  const built = buildScene(which);
  // mirror the page: the scene hangs off a world group that carries the aim
  const world = new THREE.Group();
  world.add(built.group);
  world.rotation.y = built.aim;          // as pressing "find the helicopter"
  scene.add(world);
  if (at > 0) built.drop();

  // the camera has to exist before ticking: label sizes depend on it
  const cam = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.01, 100);
  if (viewName === 'over') {
    cam.position.set(2.8, 3.4, 2.6);
    cam.lookAt(0, 1.0, -1.6);
  } else if (viewName === 'aim') {
    // exactly what the viewer sees straight after aiming: level, facing -Z
    cam.position.set(0, 1.5, 0);
    cam.lookAt(0, 1.9, -3);
  } else {
    cam.position.set(0, 1.5, 0);              // where the phone actually is
    cam.lookAt(built.landing.x * 0.55, 0.55, built.landing.z * 1.25 - 0.55);
  }
  cam.updateMatrixWorld(true);

  // fast-forward in fixed steps so the choreography runs exactly as it would
  const STEP = 1 / 60;
  for (let t = 0; t < at; t += STEP) built.tick(STEP, cam);

  renderer.render(scene, cam);

  let n = 0; scene.traverse(() => n++);
  const d = built._debug;
  const f = Math.min(d.t / d.FLIGHT, 1);
  const idx = Math.min(d.pts.length - 1, Math.floor(f * (d.pts.length - 1)));
  const got = d.flyer.position;
  // Where the drawn part of the tube actually stops. TubeGeometry samples the
  // curve with getPointAt (arc length), so the check must use that too.
  const g = d.trail.geometry;
  const drawnFrac = g.drawRange.count / g.index.count;
  const tubeEnd = g.parameters.path.getPointAt(Math.min(drawnFrac, 1));
  const byIndex = d.pts[idx];
  const P = v => `(${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)})`;
  const gap = tubeEnd.distanceTo(got);
  // where the helicopter ended up relative to straight ahead
  const hw = new THREE.Vector3(built.release.x, 0, built.release.z)
    .applyAxisAngle(new THREE.Vector3(0, 1, 0), built.aim);
  const offAxis = Math.atan2(hw.x, -hw.z) * 180 / Math.PI;
  document.getElementById('ok').innerHTML =
    `${which} · t=${at}s · phase ${built.phase} · f=${f.toFixed(3)} · ${n} objects<br>` +
    `aim ${(built.aim * 180 / Math.PI).toFixed(1)}&deg; &rarr; helicopter ` +
    `<span style="color:${Math.abs(offAxis) < 0.5 ? '#8BE04F' : '#FF6B9D'}">` +
    `${offAxis.toFixed(2)}&deg; off centre</span><br>` +
    `flyer ${P(got)} &nbsp; trail ends ${P(tubeEnd)} &nbsp; ` +
    `<span style="color:${gap < 0.05 ? '#8BE04F' : '#FF6B9D'}">gap ${gap.toFixed(3)} m</span><br>` +
    `naive pts[${idx}] would have been ${P(byIndex)} ` +
    `(off by ${byIndex.distanceTo(tubeEnd).toFixed(3)} m)`;
} catch (e) {
  err('THREW ' + (e && e.stack || e));
  document.getElementById('ok').textContent = 'FAILED';
}
</script>
</body>
</html>
