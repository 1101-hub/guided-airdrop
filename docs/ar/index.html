<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141414">
<title>Watch it land · Airdrop in AR</title>
<meta name="description" content="Point your phone at the floor and watch a relief drop land in your room — the real trajectory, at 1:13 scale.">
<style>
  :root{
    --paper:#F7F3E6; --ink:#141414; --ink2:#4E4A42; --ink3:#8C877C; --line:#E2DCCB;
    --blue:#3B54E8; --pink:#FF2E93; --green:#79D64B; --grn:#4FA828; --yellow:#FFD12E;
    --sans:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#111;
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;touch-action:none}

  #cam,#gl{position:fixed;inset:0;width:100%;height:100%}
  #cam{object-fit:cover;background:#111}
  body.nocam #cam{display:none}
  body.nocam #gl{background:linear-gradient(#C9D4EA 0%,#E6ECF7 55%,#F7F3E6 100%)}

  /* ---------------------------------------------------------- start card */
  #start{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
    background:#E4E9F2;z-index:30;overflow:auto}
  .card{background:var(--paper);border-radius:22px;box-shadow:0 14px 50px rgba(20,20,30,.22);
    padding:28px 24px;max-width:470px;width:100%}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink3);margin:0 0 10px}
  h1{font-size:clamp(34px,10vw,52px);line-height:.9;letter-spacing:-.045em;margin:0 0 12px;font-weight:800}
  .lead{font-size:clamp(17px,4.6vw,20px);line-height:1.32;color:var(--ink);font-weight:700;margin:0 0 16px}
  p{font-size:16px;line-height:1.5;color:var(--ink2);margin:0 0 14px}
  .steps{margin:0 0 18px;padding:0;list-style:none}
  .steps li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;color:var(--ink2);
    line-height:1.45;margin:0 0 8px}
  .steps b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;display:grid;place-items:center;margin-top:1px}
  .go{display:block;width:100%;font-family:var(--sans);font-size:19px;font-weight:800;
    border:3px solid var(--ink);background:var(--blue);color:#fff;border-radius:999px;
    padding:.72em 1em;cursor:pointer}
  .go:active{transform:translateY(1px)}
  .go[disabled]{opacity:.65}
  .note{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink3);
    margin:14px 0 0;line-height:1.6}
  .note a{color:var(--blue)}

  /* ----------------------------------------------------------------- HUD */
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;gap:9px;justify-content:center;flex-wrap:wrap;pointer-events:none}
  #hud button{pointer-events:auto;font-family:var(--sans);font-size:14px;font-weight:800;
    border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:999px;padding:.55em 1.15em;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.28)}
  #hud button.p{background:var(--pink);color:#fff}
  #hud a{pointer-events:auto;text-decoration:none;font-size:14px;font-weight:800;
    border:2.5px solid var(--ink);background:var(--grn);color:#fff;
    border-radius:999px;padding:.55em 1.15em;box-shadow:0 4px 14px rgba(0,0,0,.28)}

  #banner{position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex;justify-content:center;pointer-events:none}
  #banner span{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;
    padding:.45em 1em;box-shadow:0 4px 14px rgba(0,0,0,.28);text-align:center}

  /* --------------------------------------------------------- diagnostics */
  #diag{position:fixed;top:calc(52px + env(safe-area-inset-top));left:10px;right:10px;
    z-index:21;background:rgba(20,20,20,.88);color:#EDEAE0;border-radius:14px;
    padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.65;
    display:none;max-height:54vh;overflow:auto}
  #diag.on{display:block}
  #diag b{color:var(--yellow)}
  #diag .k{color:#9A958A;display:inline-block;min-width:104px}
  #diag .bad{color:#FF6B9D}
  #diag .ok{color:#8BE04F}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="banner"><span id="bannerTxt">starting…</span></div>
<div id="diag"></div>

<div id="hud">
  <button id="bReplay" class="p">&#9660; replay</button>
  <button id="bRecentre">recentre</button>
  <a id="aOther" href="?s=hit">next &rarr;</a>
  <button id="bDiag">?</button>
</div>

<div id="start">
  <div class="card">
    <p class="tag" id="sTag">Scene one</p>
    <h1 id="sTitle">Watch it miss.</h1>
    <p class="lead" id="sLead"></p>
    <ul class="steps" id="sSteps"></ul>
    <button class="go" id="bGo">Start the camera</button>
    <p class="note">Nothing is recorded or uploaded — the video never leaves your phone.
      <br>Part of <a href="../">Trajectory Optimisation for a Steerable Airdrop</a>.</p>
  </div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { ARView, MODE } from './arview.js?v=2';
import { buildScene } from './scene.js?v=2';

const $ = id => document.getElementById(id);
const which = (new URLSearchParams(location.search).get('s') === 'hit') ? 'hit' : 'miss';

/* ----------------------------------------------------------- copy per scene */
const COPY = {
  miss: {
    tag: 'Scene one of two',
    title: 'Watch it miss.',
    lead: 'A relief drop with no idea what the wind is doing.',
    steps: [
      'Stand where you can see about <strong>three metres of floor</strong> in front of you.',
      'Tap start and <strong>allow the camera</strong> — on an iPhone, allow motion too.',
      'Hold the phone up and <strong>look at the floor ahead</strong>. It falls from ceiling height.',
    ],
    banner: 'it is falling — watch where it ends up',
    done: 'missed by 23.9 m · into the water',
    other: 'scene 2 →', otherHref: '?s=hit',
  },
  hit: {
    tag: 'Scene two of two',
    title: 'Now watch it land.',
    lead: 'Same drop, same wind — but this one works the wind out on the way down.',
    steps: [
      'Stand where you have <strong>clear floor at your feet</strong> and a few metres ahead.',
      'Tap start and <strong>allow the camera</strong> — on an iPhone, allow motion too.',
      'The <strong>dotted pink line is last time</strong>. Watch the blue one instead.',
    ],
    banner: 'dotted = last time · blue = with the wind worked out',
    done: 'landed 2.35 m from target · at your feet',
    other: '← scene 1', otherHref: '?s=miss',
  },
}[which];

$('sTag').textContent = COPY.tag;
$('sTitle').textContent = COPY.title;
$('sLead').textContent = COPY.lead;
$('sSteps').innerHTML = COPY.steps
  .map((s, i) => `<li><b>${i + 1}</b><span>${s}</span></li>`).join('');
$('aOther').textContent = COPY.other;
$('aOther').href = COPY.otherHref;
document.title = `${COPY.title} · Airdrop in AR`;

/* ------------------------------------------------------------------ scene */
const view = new ARView({ canvas: $('gl'), video: $('cam'), eyeHeight: 1.5 });
view.scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.45);
sun.position.set(2, 6, 3);
view.scene.add(sun);

const scene = buildScene(which);
view.world.add(scene.group);

let settled = false;
view.onFrame(dt => {
  scene.tick(dt, view.camera);
  if (!settled && scene.phase === 'land') {
    settled = true;
    $('bannerTxt').textContent = COPY.done;
  }
});

/* --------------------------------------------------------------- controls */
const play = () => { settled = false; $('bannerTxt').textContent = COPY.banner; scene.start(); };
$('bReplay').onclick = play;
$('bRecentre').onclick = () => view.recentre();
$('bDiag').onclick = () => $('diag').classList.toggle('on');

/* ------------------------------------------------------------ diagnostics */
let frames = 0, fps = 0, last = performance.now(), raw = {};
addEventListener('deviceorientation', e => { raw = e; }, true);
view.onFrame(() => {
  frames++;
  const now = performance.now();
  if (now - last >= 500) {
    fps = Math.round(frames * 1000 / (now - last));
    frames = 0; last = now;
    if ($('diag').classList.contains('on')) paintDiag();
  }
});
const row = (k, v, cls = '') =>
  `<div><span class="k">${k}</span><span class="${cls}">${v}</span></div>`;
function paintDiag() {
  const v = $('cam');
  $('diag').innerHTML =
    row('<b>scene</b>', which) +
    row('<b>mode</b>', view.mode, view.mode === MODE.FULL ? 'ok' : 'bad') +
    row('phase', scene.phase) +
    row('fps', fps, fps >= 30 ? 'ok' : 'bad') +
    row('camera', view.cameraError || 'ok', view.cameraError ? 'bad' : 'ok') +
    row('sensors', view.orientError || 'ok', view.orientError ? 'bad' : 'ok') +
    row('video', `${v.videoWidth}x${v.videoHeight}`) +
    row('screen', `${innerWidth}x${innerHeight} @${(devicePixelRatio || 1).toFixed(1)}`) +
    row('screen ang', (screen.orientation?.angle ?? window.orientation ?? 0) + '°') +
    row('alpha', raw.alpha == null ? '—' : raw.alpha.toFixed(1)) +
    row('beta', raw.beta == null ? '—' : raw.beta.toFixed(1)) +
    row('gamma', raw.gamma == null ? '—' : raw.gamma.toFixed(1)) +
    row('model miss', `${scene.miss.toFixed(2)} m`) +
    row('flight', `${scene.flight.toFixed(1)} s`) +
    row('ua', navigator.userAgent.slice(0, 58));
}

/* --------------------------------------------------------------- startup */
$('bGo').onclick = async () => {
  $('bGo').disabled = true;
  $('bGo').textContent = 'starting…';
  let mode;
  try {
    mode = await view.start();
  } catch (e) {
    $('bGo').disabled = false;
    $('bGo').textContent = 'Try again';
    return;
  }
  if (mode !== MODE.FULL) document.body.classList.add('nocam');
  $('start').style.display = 'none';
  play();
  if (mode === MODE.DRAG) $('bannerTxt').textContent = 'no sensors — drag to look around';
};
</script>
</body>
</html>
